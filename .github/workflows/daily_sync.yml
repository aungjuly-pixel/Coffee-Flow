name: Daily Coffee Market Sync

on:
  schedule:
    # Runs Monday to Friday at 23:00 UTC (7:00 PM EST)
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute market ingestion
        run: |
          python fetch_market.py

      - name: Commit and push updated files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_coffee_market.csv ticker_snapshot.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync daily market tape [skip ci]" && git push)