name: Daily Coffee Market & COT Sync

on:
  schedule:
    # Runs Monday–Friday at 21:30 UTC (4:30 PM EST, after ICE & CFTC releases)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas xlrd requests

      - name: Fetch ICE Certified Stocks, Market Prices & CFTC COT
        run: |
          python fetch_market.py
          if [ -f "fetch_news.py" ]; then python fetch_news.py; fi

      - name: Commit and push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily market, ICE stocks & CFTC COT sync"
            git push
          else
            echo "No snapshot changes to commit."
          fi
