name: Daily Coffee Market Sync

on:
  schedule:
    # Runs Monday to Friday at 23:00 UTC (7:00 PM EST)
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute market ingestion
        run: |
          python fetch_market.py

      - name: Commit and push updated files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_coffee_market.csv ticker_snapshot.json
          git commit -m "Auto-sync daily market tape [skip ci]" || echo "No changes to commit"
          git push